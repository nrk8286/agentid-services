name: Live agent end-to-end

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-agent-e2e
  cancel-in-progress: false

jobs:
  live-agent-e2e:
    name: Workers AI agent live test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SITE_URL: https://gptmarketplus.com
      REVENUE_AI_MODEL: "@cf/zai-org/glm-4.7-flash"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the deployed Workers AI binding and scheduler
        run: npm run test:revenue-agent:live
