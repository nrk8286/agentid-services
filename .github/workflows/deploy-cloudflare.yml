name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://agentid.services
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Pin npm release toolchain
        run: |
          npm install --global npm@12.0.2
          test "$(node --version)" != ""
          test "$(npm --version)" = "12.0.2"
      - run: npm ci
      - run: npm run validate
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify canonical production routes
        env:
          SITE_URL: https://gptmarketplus.com
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.SITE_URL;
          const checks = [
            { path: "/", status: 200 },
            { path: "/pricing", status: 200, includes: "Primary self-serve path" },
            { path: "/ai-agent-launch-kit", status: 200, includes: "private PayPal-gated workspace" },
            { path: "/api/agents/health", status: 200, json: (body) => body.ok === true },
            { path: "/api/paypal/status", status: 200, json: (body) => body.publicCommerceReady === true && body.digitalProductReady === true && body.serviceCheckoutEnabled === false },
            { path: "/api/agents/revenue", status: 200, json: (body) => body.verifiedRevenueGoalDollars === 10000 },
            { path: "/launch-kit/workspace", status: 400, headers: { "cache-control": "private, no-store", "x-robots-tag": "noindex,nofollow,noarchive" } },
            { path: "/api/paypal/launch-kit/workspace/download?order_id=invalid&access_token=invalid", status: 402, headers: { "cache-control": "private, no-store", "x-robots-tag": "noindex,nofollow,noarchive", "referrer-policy": "no-referrer" } },
            { path: "/api/paypal/digital-products/ai-agent-launch-kit?order_id=invalid&access_token=invalid", status: 402, headers: { "cache-control": "private, no-store", "x-robots-tag": "noindex,nofollow,noarchive", "referrer-policy": "no-referrer" } },
          ];
          for (const check of checks) {
            const response = await fetch(`${base}${check.path}`, { redirect: "manual" });
            const text = await response.text();
            if (response.status !== check.status) throw new Error(`${check.path}: expected ${check.status}, got ${response.status}`);
            if (check.includes && !text.includes(check.includes)) throw new Error(`${check.path}: expected marker missing`);
            if (check.json) {
              let body;
              try { body = JSON.parse(text); } catch { throw new Error(`${check.path}: invalid JSON`); }
              if (!check.json(body)) throw new Error(`${check.path}: readiness assertion failed`);
            }
            for (const [name, expected] of Object.entries(check.headers || {})) {
              const actual = (response.headers.get(name) || "").toLowerCase();
              if (!actual.includes(expected)) throw new Error(`${check.path}: ${name} expected ${expected}, got ${actual || "<missing>"}`);
            }
            console.log(`verified ${check.path} (${response.status})`);
          }
          NODE
