name: Verify Cloudflare deployment preconditions
on:
  workflow_dispatch:
    inputs:
      theme_action:
        description: Publisher appearance release (redeploy preserves the current appearance)
        type: choice
        options:
          - redeploy
          - apply-dark-water
          - rollback-dark-water
        default: redeploy
      inspect_only:
        description: Inspect release and conditional-request support without publishing
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: production-cloudflare
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Inspect release IDs and reject an invalid conditional request
          cache: npm
      - name: Pin npm release toolchain
        run: |
          npm install --global npm@12.0.2
          test "$(node --version)" != ""
          test "$(npm --version)" = "12.0.2"
      - run: npm ci
      - run: npm run validate
      - name: Verify conditional publication support
        run: node scripts/inspect-production-release.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply or roll back the reviewed publisher theme
        if: ${{ !inputs.inspect_only && inputs.theme_action != 'redeploy' }}
        env:
          THEME_ACTION: ${{ inputs.theme_action }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          case "$THEME_ACTION" in
            apply-dark-water) node scripts/release-publisher-theme.mjs apply ;;
            rollback-dark-water) node scripts/release-publisher-theme.mjs rollback ;;
            *) echo "Unexpected theme action" >&2; exit 1 ;;
          esac
      - name: Redeploy verified production publisher content
        if: ${{ !inputs.inspect_only && inputs.theme_action == 'redeploy' }}
        run: node scripts/redeploy-production.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID + '/workers/scripts/agentid-services-agent-system';
          const headers = {authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN};
          const current = await fetch(base + '/content/v2', {headers, redirect:'error'});
          console.log('content status', current.status, 'etag', current.headers.get('etag'));
          await current.body.cancel();
          const deployments = await (await fetch(base + '/deployments', {headers, redirect:'error'})).json();
          const latest = deployments.result?.deployments?.[0];
          console.log(JSON.stringify({latestDeployment: latest && {id:latest.id, created_on:latest.created_on, versions:latest.versions}},null,2));
          // The body is deliberately invalid: no metadata, entrypoint, or module.
          // If the precondition is unsupported, schema validation must reject it.
          const response = await fetch(base + '/content', {method:'PUT',headers:{...headers,'If-Match':'"definitely-not-the-current-worker-etag"','Content-Type':'application/json'},body:'{}',redirect:'error'});
          const body = await response.json();
          console.log(JSON.stringify({invalidPreconditionStatus:response.status, success:body.success, errorCodes:body.errors?.map(e=>e.code)},null,2));
          if(response.ok) throw new Error('Unexpected acceptance of invalid body');
          NODE
      - name: Verify the requested publisher appearance
        if: ${{ !inputs.inspect_only && inputs.theme_action != 'redeploy' }}
        env:
          THEME_ACTION: ${{ inputs.theme_action }}
        run: |
          node --input-type=module <<'NODE'
          const applied = process.env.THEME_ACTION === 'apply-dark-water';
          for (const path of ['/', '/guides', '/solutions', '/ai-agent-launch-kit', '/contact', '/guides/srt-to-markdown-before-and-after']) {
            const response = await fetch(`https://gptmarketplus.com${path}`, { signal: AbortSignal.timeout(15000) });
            const html = await response.text();
            if (response.status !== 200) throw new Error(`${path}: unexpected HTTP ${response.status}`);
            if (html.includes('data-gmp-theme="dark-water"') !== applied) throw new Error(`${path}: unexpected theme state`);
            if (applied && (!html.includes('/__gmp/dark-water.css?v=') || !html.includes('/__gmp/water.js?v='))) throw new Error(`${path}: missing theme assets`);
            console.log(`verified appearance ${path}`);
          }
          if (applied) {
            for (const [path, type, marker] of [['/__gmp/dark-water.css','text/css','--gmp-text'],['/__gmp/water.js','text/javascript','prefers-reduced-motion']]) {
              const response = await fetch(`https://gptmarketplus.com${path}`, { signal: AbortSignal.timeout(15000) });
              if (response.status !== 200 || !(response.headers.get('content-type') || '').includes(type) || !(await response.text()).includes(marker)) throw new Error(`${path}: invalid theme asset`);
            }
          }
          NODE
