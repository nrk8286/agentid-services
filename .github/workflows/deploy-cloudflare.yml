name: Verify Cloudflare deployment preconditions
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-cloudflare
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Inspect release IDs and reject an invalid conditional request
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID + '/workers/scripts/agentid-services-agent-system';
          const headers = {authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN};
          const current = await fetch(base + '/content/v2', {headers, redirect:'error'});
          console.log('content status', current.status, 'etag', current.headers.get('etag'));
          await current.body.cancel();
          const deployments = await (await fetch(base + '/deployments', {headers, redirect:'error'})).json();
          const latest = deployments.result?.deployments?.[0];
          console.log(JSON.stringify({latestDeployment: latest && {id:latest.id, created_on:latest.created_on, versions:latest.versions}},null,2));
          // The body is deliberately invalid: no metadata, entrypoint, or module.
          // If the precondition is unsupported, schema validation must reject it.
          const response = await fetch(base + '/content', {method:'PUT',headers:{...headers,'If-Match':'"definitely-not-the-current-worker-etag"','Content-Type':'application/json'},body:'{}',redirect:'error'});
          const body = await response.json();
          console.log(JSON.stringify({invalidPreconditionStatus:response.status, success:body.success, errorCodes:body.errors?.map(e=>e.code)},null,2));
          if(response.ok) throw new Error('Unexpected acceptance of invalid body');
          NODE
